<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM YouTube Tracker — Topic Graph</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    overflow: hidden;
  }
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: rgba(13,17,23,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #21262d;
    padding: 12px 24px;
    display: flex; align-items: center; gap: 16px;
  }
  #header h1 { font-size: 18px; font-weight: 600; }
  #header .sep { color: #484f58; }
  #header a { color: #58a6ff; text-decoration: none; font-size: 14px; }
  #header a:hover { text-decoration: underline; }
  #controls {
    display: flex; align-items: center; gap: 12px; margin-left: auto;
  }
  #controls label { font-size: 13px; color: #8b949e; }
  #controls select {
    background: #161b22; color: #e6edf3; border: 1px solid #30363d;
    border-radius: 6px; padding: 4px 8px; font-size: 13px;
  }
  #stats { font-size: 12px; color: #8b949e; }
  #graph-container {
    position: fixed;
    top: 52px; left: 0; right: 0; bottom: 0;
  }
  #graph-container svg { display: block; }
  .graph-link { stroke: #30363d; stroke-opacity: 0.6; }
  .graph-link.highlighted { stroke: #58a6ff; stroke-opacity: 1; }
  .graph-link.dimmed { stroke-opacity: 0.1; }
  .graph-node text { fill: #8b949e; font-size: 10px; pointer-events: none; }
  .graph-node circle { cursor: pointer; stroke-width: 1.5; transition: opacity 0.2s; }
  .graph-node.dimmed circle { opacity: 0.15; }
  .graph-node.dimmed text { opacity: 0.1; }
  .graph-node.highlighted circle { stroke: #58a6ff; stroke-width: 2.5; }

  #tooltip {
    position: fixed; z-index: 20; pointer-events: none;
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 12px 16px; max-width: 320px; font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    opacity: 0; transition: opacity 0.15s;
  }
  #tooltip.visible { opacity: 1; }
  #tooltip h3 { font-size: 14px; margin-bottom: 4px; color: #e6edf3; }
  #tooltip .channels { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  #tooltip .ch-tag {
    font-size: 11px; padding: 2px 6px; border-radius: 4px;
    background: #21262d; color: #8b949e; border-left: 3px solid #8b949e;
  }
  #tooltip .video-list { margin-top: 6px; font-size: 12px; color: #8b949e; }
</style>
</head>
<body>

<div id="header">
  <h1>🔗 Topic Relation Graph</h1>
  <span class="sep">·</span>
  <a href="/">← Dashboard</a>
  <div id="controls">
    <label>Min channels:
      <select id="minConn" onchange="initGraph()">
        <option value="1">1+</option>
        <option value="2" selected>2+</option>
        <option value="3">3+</option>
        <option value="4">4+</option>
      </select>
    </label>
    <label>Channel:
      <select id="channelFilter" onchange="initGraph()">
        <option value="all">All Channels</option>
      </select>
    </label>
    <span id="stats"></span>
  </div>
</div>

<div id="graph-container"></div>
<div id="tooltip"></div>

<script>
const CHANNEL_COLORS = {
  'Andrej Karpathy': '#f97316',
  '3Blue1Brown': '#3b82f6',
  'Two Minute Papers': '#22c55e',
  'Yannic Kilcher': '#a855f7',
  'AI Explained': '#ef4444',
  'Fireship': '#f59e0b',
  'Sam Witteveen': '#6366f1',
  'The AI Epiphany': '#ec4899',
  'Wes Roth': '#14b8a6',
  'Dave Ebbelaar': '#8b5cf6',
  'All About AI': '#06b6d4',
  '1littlecoder': '#f43f5e'
};

let DATA = null;
let activeNode = null;

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function loadData() {
  const resp = await fetch('/data.json');
  DATA = await resp.json();

  // Populate channel filter
  const channels = new Set();
  (DATA.videos || []).forEach(v => channels.add(v.channel_name));
  const sel = document.getElementById('channelFilter');
  [...channels].sort().forEach(ch => {
    const opt = document.createElement('option');
    opt.value = ch; opt.textContent = ch;
    sel.appendChild(opt);
  });

  initGraph();
}

function initGraph() {
  const channelFilter = document.getElementById('channelFilter').value;
  const minConn = parseInt(document.getElementById('minConn').value) || 1;

  const connections = (DATA ? DATA.connections : []) || [];

  const filtered = connections.filter(c => {
    if (channelFilter === 'all') return true;
    return (c.videos || []).some(v => v.channel === channelFilter);
  }).filter(c => (c.channel_count || 0) >= minConn);

  const topicVideos = {};
  const topicChannels = {};
  const edgeMap = {};

  filtered.filter(c => (c.cluster_topics || [c.topic]).length <= 12).forEach(c => {
    const topics = c.cluster_topics || [c.topic];
    const vids = c.videos || [];

    topics.forEach(t => {
      if (!topicVideos[t]) { topicVideos[t] = []; topicChannels[t] = new Set(); }
      vids.forEach(v => {
        topicVideos[t].push(v);
        topicChannels[t].add(v.channel);
      });
    });

    for (let i = 0; i < topics.length; i++) {
      for (let j = i + 1; j < topics.length; j++) {
        const key = [topics[i], topics[j]].sort().join('|||');
        if (!edgeMap[key]) edgeMap[key] = { source: topics[i], target: topics[j], weight: 0 };
        edgeMap[key].weight++;
      }
    }
  });

  const validTopics = Object.keys(topicVideos);
  const nodes = validTopics.map(t => ({
    id: t,
    count: topicVideos[t].length,
    channels: [...topicChannels[t]],
    primaryChannel: [...topicChannels[t]].sort((a,b) =>
      topicVideos[t].filter(v => v.channel === b).length -
      topicVideos[t].filter(v => v.channel === a).length
    )[0],
    videos: topicVideos[t]
  }));

  const links = Object.values(edgeMap);

  document.getElementById('stats').textContent = nodes.length + ' topics · ' + links.length + ' links';
  drawGraph(nodes, links);
}

function drawGraph(nodes, links) {
  const container = document.getElementById('graph-container');
  container.innerHTML = '';
  if (!nodes.length) { container.innerHTML = '<div style="text-align:center;color:#8b949e;padding:60px">No topics match filters</div>'; return; }

  const width = container.clientWidth;
  const height = container.clientHeight || window.innerHeight - 52;
  const radiusScale = d3.scaleSqrt().domain([1, d3.max(nodes, d => d.count) || 1]).range([5, 28]);

  const svg = d3.select(container).append('svg').attr('width', width).attr('height', height);
  const g = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.2, 5]).on('zoom', e => g.attr('transform', e.transform)));

  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(80).strength(l => Math.min(l.weight * 0.1, 0.5)))
    .force('charge', d3.forceManyBody().strength(-120))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(d => radiusScale(d.count) + 4));

  const link = g.append('g').selectAll('line').data(links).join('line')
    .attr('class', 'graph-link').attr('stroke-width', d => Math.sqrt(d.weight));

  const node = g.append('g').selectAll('g').data(nodes).join('g').attr('class', 'graph-node')
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end', (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
    );

  node.append('circle')
    .attr('r', d => radiusScale(d.count))
    .attr('fill', d => CHANNEL_COLORS[d.primaryChannel] || '#8b949e')
    .attr('stroke', d => d3.color(CHANNEL_COLORS[d.primaryChannel] || '#8b949e').darker(0.5))
    .on('mouseover', (e, d) => showTooltip(e, d))
    .on('mouseout', hideTooltip)
    .on('click', (e, d) => {
      if (activeNode === d.id) {
        activeNode = null;
        node.classed('dimmed', false).classed('highlighted', false);
        link.classed('dimmed', false).classed('highlighted', false);
        return;
      }
      activeNode = d.id;
      const connected = new Set([d.id]);
      link.each(function(l) { if (l.source.id === d.id || l.target.id === d.id) { connected.add(l.source.id); connected.add(l.target.id); } });
      node.classed('dimmed', n => !connected.has(n.id)).classed('highlighted', n => n.id === d.id);
      link.classed('dimmed', l => l.source.id !== d.id && l.target.id !== d.id).classed('highlighted', l => l.source.id === d.id || l.target.id === d.id);
    });

  node.append('text').text(d => d.count >= 2 ? (d.id.length > 25 ? d.id.slice(0,22) + '…' : d.id) : '')
    .attr('dy', d => radiusScale(d.count) + 12).attr('text-anchor', 'middle');

  simulation.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
  });
}

function showTooltip(event, d) {
  const tt = document.getElementById('tooltip');
  const channelTags = d.channels.map(ch => '<span class="ch-tag" style="border-left:3px solid ' + (CHANNEL_COLORS[ch] || '#8b949e') + '">' + ch + '</span>').join('');
  const videoList = d.videos.slice(0, 4).map(v => '<div>• ' + esc(v.title.slice(0, 50)) + (v.title.length > 50 ? '…' : '') + '</div>').join('');
  const more = d.videos.length > 4 ? '<div style="color:#58a6ff">+' + (d.videos.length - 4) + ' more</div>' : '';
  tt.innerHTML = '<h3>' + esc(d.id) + '</h3><div style="color:#8b949e">' + d.videos.length + ' video' + (d.videos.length > 1 ? 's' : '') + '</div><div class="channels">' + channelTags + '</div><div class="video-list">' + videoList + more + '</div>';
  tt.classList.add('visible');
  const ttW = Math.min(tt.offsetWidth, 320);
  const ttH = tt.offsetHeight || 160;
  let x = event.clientX + 12;
  let y = event.clientY - 10;
  if (x + ttW > window.innerWidth) x = event.clientX - ttW - 12;
  if (y + ttH > window.innerHeight) y = window.innerHeight - ttH - 8;
  if (y < 8) y = 8;
  tt.style.left = x + 'px';
  tt.style.top = y + 'px';
}
function hideTooltip() { document.getElementById('tooltip').classList.remove('visible'); }

loadData();
</script>
</body>
</html>
